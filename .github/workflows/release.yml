name: Build And Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            cmd: npm run dist:win
          - os: ubuntu-22.04
            name: linux
            cmd: npm run dist:linux
          - os: macos-15-intel
            name: macos-x64
            cmd: npm run dist:mac:x64
          - os: macos-15
            name: macos-arm64
            cmd: npm run dist:mac:arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install musicdl helper deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          git clone --depth 1 https://github.com/CharlesPikachu/musicdl.git "$RUNNER_TEMP/musicdl"
          python -m pip install "$RUNNER_TEMP/musicdl"
          echo "MUSICDL_REPO=$RUNNER_TEMP/musicdl" >> "$GITHUB_ENV"

      - name: Install deps
        run: npm ci

      - name: Build distributables
        run: ${{ matrix.cmd }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*Setup*.exe
            release/*Setup*.exe.blockmap
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.dmg
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*Setup*.exe
            artifacts/**/*Setup*.exe.blockmap
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
