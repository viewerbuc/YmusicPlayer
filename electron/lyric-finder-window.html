<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: file: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https:;"
    />
    <title>歌词查找</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121212;
      }
      .root {
        height: 100%;
        display: grid;
        grid-template-rows: 48px 1fr;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(28, 28, 28, 0.92);
      }
      .btn {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .url {
        flex: 1;
        min-width: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      webview {
        width: 100%;
        height: 100%;
        border: 0;
        background: #111;
      }
    </style>
  </head>
  <body>
    <div class="root">
      <div class="bar">
        <button id="back" class="btn" title="后退">←</button>
        <button id="forward" class="btn" title="前进">→</button>
        <button id="reload" class="btn" title="刷新">⟳</button>
        <div id="url" class="url">https://www.toomic.com/</div>
      </div>
      <webview id="view" partition="persist:lyric-finder"></webview>
    </div>
    <script>
      const view = document.getElementById('view');
      const backBtn = document.getElementById('back');
      const forwardBtn = document.getElementById('forward');
      const reloadBtn = document.getElementById('reload');
      const urlNode = document.getElementById('url');

      const params = new URLSearchParams(window.location.search);
      const initialUrl = params.get('url') || 'https://www.toomic.com/';
      let domReady = false;
      let pendingUrl = '';

      urlNode.textContent = initialUrl;
      view.setAttribute('src', initialUrl);

      const syncNavState = () => {
        if (!domReady) return;
        try {
          backBtn.disabled = !view.canGoBack();
          forwardBtn.disabled = !view.canGoForward();
          const currentUrl = view.getURL?.() || view.getAttribute('src') || '';
          urlNode.textContent = currentUrl || 'about:blank';
        } catch (_) {
          backBtn.disabled = true;
          forwardBtn.disabled = true;
        }
      };

      backBtn.disabled = true;
      forwardBtn.disabled = true;

      backBtn.addEventListener('click', () => {
        if (domReady && view.canGoBack()) view.goBack();
      });
      forwardBtn.addEventListener('click', () => {
        if (domReady && view.canGoForward()) view.goForward();
      });
      reloadBtn.addEventListener('click', () => {
        if (domReady) view.reload();
      });

      view.addEventListener('dom-ready', () => {
        domReady = true;
        if (pendingUrl) {
          const next = pendingUrl;
          pendingUrl = '';
          view.loadURL(next);
        }
        syncNavState();
      });
      view.addEventListener('did-start-loading', syncNavState);
      view.addEventListener('did-stop-loading', syncNavState);
      view.addEventListener('did-navigate', syncNavState);
      view.addEventListener('did-navigate-in-page', syncNavState);

      window.lyricFinderAPI?.onOpenUrl((url) => {
        if (!url) return;
        urlNode.textContent = url;
        if (domReady) {
          view.loadURL(url);
        } else {
          pendingUrl = url;
        }
      });
    </script>
  </body>
</html>
